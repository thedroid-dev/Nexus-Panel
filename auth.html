<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solari Host | Acceso al Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #060608;
            --bg-panel: #0d0d12;
            --border-color: rgba(255, 204, 0, 0.15);
            --accent-yellow: #ffcc00;
            --accent-yellow-glow: rgba(255, 204, 0, 0.2);
            --text-main: #f3f3f6;
            --text-muted: #8c8c9e;
            --font-sans: 'Outfit', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-base); color: var(--text-main); font-family: var(--font-sans); display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        .auth-card { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 16px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        .auth-logo { text-align: center; margin-bottom: 25px; }
        .auth-logo i { font-size: 2.5rem; color: var(--accent-yellow); margin-bottom: 10px; display: block; }
        .auth-logo h1 { font-size: 1.5rem; font-weight: 800; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: var(--text-main); }
        .form-control { width: 100%; background: var(--bg-base); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px 16px; color: var(--text-main); font-size: 0.95rem; outline: none; }
        .form-control:focus { border-color: var(--accent-yellow); box-shadow: 0 0 12px var(--accent-yellow-glow); }

        .btn-auth { width: 100%; background: linear-gradient(135deg, var(--accent-yellow), #e6b800); color: #000; font-weight: 700; padding: 14px; border: none; border-radius: 10px; cursor: pointer; font-size: 1rem; box-shadow: 0 4px 20px var(--accent-yellow-glow); transition: 0.3s; }
        .btn-auth:hover { filter: brightness(1.1); }

        .error-msg { background: rgba(255,42,77,0.15); border: 1px solid #ff2a4d; color: #ff2a4d; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 15px; display: none; font-weight: 600; text-align: center; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="auth-logo">
            <i class="fa-solid fa-cube"></i>
            <h1>Solari Host</h1>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 5px;">Inicia sesión o regístrate para continuar</p>
        </div>

        <div id="authError" class="error-msg">Por favor, rellena todos los campos.</div>

        <form onsubmit="handleAuth(event)">
            <div class="form-group">
                <label>Nombre de Usuario o Email</label>
                <input type="text" id="username" class="form-control" placeholder="Ej. 71x7" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-auth"><i class="fa-solid fa-right-to-bracket"></i> Acceder al Panel</button>
        </form>
    </div>

    <script>
        function handleAuth(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if(!user || !pass) {
                document.getElementById('authError').style.display = 'block';
                return;
            }

            // Guardar estado de sesión activa
            const sessionData = {
                username: user,
                loggedInAt: new Date().toISOString()
            };
            localStorage.setItem('solari_active_session', JSON.stringify(sessionData));

            // Redirigir al panel de creación o consola directamente
            window.location.href = 'panel.html';
        }
    </script>
</body>
</html>
